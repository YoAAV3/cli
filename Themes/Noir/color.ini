; Noir — black + crimson client theme for the Lyricly fork.
; text               = Titles, active items, headings (white, never red).
; subtext            = Secondary text (soft gray-white).
; main/sidebar/player= Near-black steps (warm); depth from tone, not borders.
; button             = THE red accent (crimson): play, progress, toggles.
; button-active      = Wine for pressed/selected states.
; button-disabled    = Dark gray bars.
; tab-active         = Wine for active nav/header tabs.
; selected-row       = Light gray for selected rows, scrollbars, captions.
; notification-error = Standard red for errors (never the accent).

[noir]
text               = FFFFFF
subtext            = B8B0B0
main               = 0B0909
sidebar            = 0F0C0C
player             = 120D0D
card               = 1E1515
shadow             = 000000
selected-row       = C8C0C0
button             = E0112B
button-active      = 7A0E1E
button-disabled    = 3A3333
tab-active         = 7A0E1E
notification       = E0112B
notification-error = e22134
misc               = BFBFBF
